# equirements based on LibreOffice official documentation:
# - Minimum 25 GB free disk space
# - Minimum 4 GB RAM (8 GB recommended)
# - GCC 12+ required (ubuntu-latest has GCC 13)
# - Build time: 1-6 hours depending on hardware
# - Source: https://wiki.documentfoundation.org/Development/BuildingOnLinux

on:
  push:
    branches: [ distro/collabora/co-25.04, distro/collabora/co-25.04]
  pull_request:
    branches: [ distro/collabora/co-25.04, distro/collabora/co-25.04]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clone for faster checkout

      
      
      - name: Install build dependencies
        run: |
          # Enable deb-src repositories for build-dep to work
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
          echo "deb-src http://archive.ubuntu.com/ubuntu/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb-src http://archive.ubuntu.com/ubuntu/ $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          
          sudo apt-get update
          
          # Use build-dep for automatic dependency resolution (should work now)
          sudo apt-get build-dep -y libreoffice || echo "build-dep failed, continuing with manual install"
          
          # Install essential packages (some may already be installed by build-dep)
          sudo apt-get install -y \
              gcc-12 \
              g++-12 \
              lcov \
              git \
              build-essential \
              zip \
              junit4 \
              libkrb5-dev \
              nasm \
              graphviz \
              python3 \
              python3-dev \
              python3-setuptools \
              autoconf \
              libcups2-dev \
              libfontconfig1-dev \
              gperf \
              openjdk-17-jdk \
              doxygen \
              libxslt1-dev \
              xsltproc \
              libxml2-utils \
              libxrandr-dev \
              libx11-dev \
              bison \
              flex \
              libgtk-3-dev \
              libgstreamer-plugins-base1.0-dev \
              libgstreamer1.0-dev \
              ant \
              ant-optional \
              libnss3-dev \
              libavahi-client-dev \
              libxt-dev \
              meson \
              libcmis-dev \
              libabw-dev \
              libcdr-dev \
              libclucene-dev \
              libe-book-dev \
              libepubgen-dev \
              libetonyek-dev \
              libexttextcat-dev \
              libfreehand-dev \
              liblangtag-dev \
              libmspub-dev \
              libmwaw-dev \
              libmythes-dev \
              libodfgen-dev \
              liborcus-dev \
              libpagemaker-dev \
              libqxp-dev \
              librevenge-dev \
              libstaroffice-dev \
              libvisio-dev \
              libwpd-dev \
              libwpg-dev \
              libwps-dev \
              libzmf-dev \
              libboost-dev \
              libboost-date-time-dev \
              libboost-filesystem-dev \
              libboost-iostreams-dev \
              libboost-program-options-dev \
              libcppunit-dev \
              libepoxy-dev \
              libgpgme-dev \
              libgraphite2-dev \
              libharfbuzz-dev \
              libhunspell-dev \
              libhyphen-dev \
              libicu-dev \
              liblcms2-dev \
              libmd4c-dev \
              libneon27-dev \
              libpoppler-cpp-dev \
              libpoppler-dev \
              libraptor2-dev \
              librasqal3-dev \
              librdf0-dev \
              libssl-dev \
              libtool \
              unzip \
              wget \
              zlib1g-dev \
              libexpat1-dev \
              libjpeg-dev \
              libpng-dev \
              libtiff-dev \
              libwebp-dev \
              libfreetype6-dev \
              libnumbertext-dev \
              libbox2d-dev \
              libglm-dev \
              libglew-dev \
              libbluetooth-dev \
              libgpg-error-dev \
              libgcrypt20-dev \
              libxmlsec1-dev \
              libxmlsec1-openssl \
              libtommath-dev \
              libabsl-dev \
              libdrm-dev \
              libegl1-mesa-dev \
              libgbm-dev \
              libeot-dev \
              libmdds-dev \
              pkg-config \
              gawk \
              libpango1.0-dev \
              libcairo2-dev \
              libglib2.0-dev \
              libgtk2.0-dev \
              libdbus-1-dev \
              libdbus-glib-1-dev \
              libgsf-1-dev \
              libjpeg8-dev \
              libpng16-16 \
              libgstreamer-plugins-good1.0-dev \
              fonts-liberation \
              fonts-dejavu \
              fonts-noto \
              libcmis-dev \
              libboost-locale-dev \
              libboost-system-dev \
              libboost-filesystem-dev \
              libsane-dev \
              unixodbc-dev \
              libcurl4-openssl-dev \
              doxygen

          
      - name: Configure build
        run: |
          # Configure with coverage flags for compilation and linking
          # Set LDFLAGS to include coverage for linking gcov runtime
          export CC="gcc"
          export CXX="g++"
          ./autogen.sh \
              --disable-epm \
              --without-package-format \
              --enable-debug \
              --with-extra-cc-flags="--coverage" \
              --with-extra-cxx-flags="--coverage" \
              --with-system-libs \
              --with-system-md4c=no \
              --with-system-xmlsec=no \
              --with-system-mdds=no \
              --with-system-dragonbox=no \
              --with-system-fast-float=no \
              --with-system-frozen=no \
              --with-system-libfixmath=no \
              --with-system-orcus=no \
              --with-system-harfbuzz=no \
              --with-system-graphite=no \
              --with-system-argon2=no \
              --with-system-zxcvbn=no \
              --disable-firebird-sdbc \
              --disable-skia \
              --enable-symbols \
              --disable-cups \
              --disable-zxing \
              --disable-coinmp \
              --disable-gpgmepp \
              --disable-dbus \
              --disable-epm \
              --disable-libcmis \
              --disable-gio \
              --disable-gstreamer-1-0 \
              --disable-gtk3 \
              --disable-gtk4 \
              --disable-introspection \
              --disable-ldap \
              --disable-lotuswordpro \
              --disable-lpsolve \
              --disable-mariadb-sdbc \
              --disable-odk \
              --disable-online-update \
              --disable-pdfimport \
              --disable-pdfium \
              --disable-postgresql-sdbc \
              --disable-report-builder \
              --disable-scripting-beanshell \
              --disable-scripting-javascript \
              --disable-sdremote \
              --disable-sdremote-bluetooth \
              --enable-python=no \
              --with-galleries=no \
              --with-help=no \
              --with-myspell-dicts=no \
              --without-java \
              --without-junit \
              --without-system-dicts \
              --without-theme \
              --with-doxygen=/usr/bin/doxygen \
              --with-help=html
      
      - name: Build LibreOffice
        run: |
            # Set compiler
            export CC="gcc"
            export CXX="g++"
            make -j$(nproc)
      
      - name: Create LibreOffice build tar for Collabora
        run: |
          echo "Creating LibreOffice build tar (instdir + include + UnpackedTarball)..."
          
          # Check what we have
          echo "Checking for instdir..."
          ls -la instdir 2>/dev/null | head -5 || echo "instdir not found in root"
          echo "Checking for include..."
          ls -la include 2>/dev/null | head -5 || echo "include not found in root"
          echo "Checking for workdir/UnpackedTarball..."
          ls -la workdir/UnpackedTarball 2>/dev/null | head -5 || echo "UnpackedTarball not found"
          
          # Fix permissions
          echo "Fixing permissions..."
          [ -d "workdir/UnpackedTarball" ] && chmod -R u+r workdir/UnpackedTarball 2>/dev/null || true
          [ -d "instdir" ] && chmod -R u+r instdir 2>/dev/null || true
          [ -d "include" ] && chmod -R u+r include 2>/dev/null || true
          
          # Create tar file with instdir, include, and UnpackedTarball
          TAR_FILE="libreoffice-external-$(date +%Y%m%d-%H%M%S).tar.gz"
          
          if [ -d "instdir" ] && [ -d "include" ]; then
            echo "Creating tar with instdir, include, and UnpackedTarball..."
            tar -czf "$TAR_FILE" \
              instdir \
              include \
              workdir/UnpackedTarball 2>/dev/null || \
            tar -czf "$TAR_FILE" \
              instdir \
              include
          elif [ -d "instdir" ]; then
            echo "Creating tar with instdir and UnpackedTarball..."
            tar -czf "$TAR_FILE" \
              instdir \
              workdir/UnpackedTarball 2>/dev/null || \
            tar -czf "$TAR_FILE" instdir
          elif [ -d "workdir/UnpackedTarball" ]; then
            echo "Warning: Only UnpackedTarball found, creating tar with it..."
            tar -czf "$TAR_FILE" -C workdir UnpackedTarball
          else
            echo "ERROR: Neither instdir nor UnpackedTarball found!"
            exit 1
          fi
          
          # Check if tar was created successfully
          if [ -f "$TAR_FILE" ]; then
            echo "✓ LibreOffice build tar created successfully: $TAR_FILE"
            ls -lh "$TAR_FILE"
            echo "Checking tar contents..."
            tar -tzf "$TAR_FILE" | head -20
          else
            echo "ERROR: Failed to create tar file"
            exit 1
          fi
        continue-on-error: true
      
      - name: Upload external tar artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libreoffice-external-tar
          path: libreoffice-external-*.tar.gz
          retention-days: 30
        continue-on-error: true
        
